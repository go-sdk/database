services:
  mysql:
    profiles: [ "mysql" ]
    image: mysql:9.7
    environment:
      - "TZ=Asia/Shanghai"
      - "MYSQL_ROOT_PASSWORD=12345678"
      - "MYSQL_DATABASE=test"
    ports:
      - "3001:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p12345678" ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 30s

  mariadb:
    profiles: [ "mariadb" ]
    image: mariadb:12.3
    environment:
      - "TZ=Asia/Shanghai"
      - "MARIADB_ROOT_PASSWORD=12345678"
      - "MARIADB_DATABASE=test"
    ports:
      - "3002:3306"
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 30s

  postgres:
    profiles: [ "postgres" ]
    image: postgres:18.6
    environment:
      - "TZ=Asia/Shanghai"
      - "POSTGRES_PASSWORD=12345678"
      - "POSTGRES_DB=test"
    ports:
      - "3003:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d test" ]
      interval: 2s
      timeout: 3s
      retries: 60
